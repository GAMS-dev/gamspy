<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" font-family="Helvetica, Arial, sans-serif">
  <title>Piecewise linear graph with overlapping chains</title>
  <desc>Two independent chains provide two valid y-values between x equals 2 and x equals 3.</desc>
  <rect width="480" height="330" fill="#eeeeee"/>

  <g fill="none" stroke="#777777" stroke-opacity="0.45" stroke-width="1">
    <path d="M120 30 V270 M180 30 V270 M240 30 V270 M300 30 V270 M360 30 V270 M420 30 V270"/>
    <path d="M60 210 H420 M60 150 H420 M60 90 H420 M60 30 H420"/>
  </g>

  <g fill="none" stroke="#222222" stroke-width="1.5">
    <path d="M45 270 H435"/>
    <path d="M60 285 V15"/>
  </g>

  <path d="M60 150 L120 210 L240 210" fill="none" stroke="#6f52b5" stroke-width="4"/>
  <g fill="#6f52b5" stroke="#6f52b5" stroke-width="3">
    <circle cx="60" cy="150" r="6"/>
    <circle cx="120" cy="210" r="6"/>
    <circle cx="240" cy="210" r="6"/>
  </g>
  <path d="M180 150 L300 150 L360 90" fill="none" stroke="#c84a46" stroke-width="4"/>
  <g fill="#c84a46" stroke="#c84a46" stroke-width="3">
    <circle cx="180" cy="150" r="6"/>
    <circle cx="300" cy="150" r="6"/>
    <circle cx="360" cy="90" r="6"/>
  </g>

  <g fill="#222222" font-size="14" text-anchor="middle">
    <text x="60" y="292">0</text>
    <text x="120" y="292">1</text>
    <text x="180" y="292">2</text>
    <text x="240" y="292">3</text>
    <text x="300" y="292">4</text>
    <text x="360" y="292">5</text>
    <text x="420" y="292">6</text>
  </g>
  <g fill="#222222" font-size="14" text-anchor="end">
    <text x="53" y="215">1</text>
    <text x="53" y="155">2</text>
    <text x="53" y="95">3</text>
    <text x="53" y="35">4</text>
  </g>
  <g fill="#222222" font-family="Georgia, serif" font-size="20" font-style="italic">
    <text x="435" y="307">x</text>
    <text x="20" y="27">y</text>
  </g>
</svg>
