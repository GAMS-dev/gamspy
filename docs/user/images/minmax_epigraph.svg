<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" font-family="Helvetica, Arial, sans-serif">
  <title>Inequalities of a maximum</title>
  <desc>The inequalities y greater than or equal to each operand allow every point on or above the maximum of the operands.</desc>
  <rect width="420" height="330" fill="#eeeeee"/>

  <g fill="none" stroke="#777777" stroke-opacity="0.45" stroke-width="1">
    <path d="M120 30 V270 M180 30 V270 M240 30 V270 M300 30 V270 M360 30 V270"/>
    <path d="M60 210 H360 M60 150 H360 M60 90 H360 M60 30 H360"/>
  </g>

  <path d="M60 30 V90 L210 165 L360 90 V30 Z" fill="#375a9e" fill-opacity="0.18"/>

  <g fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="7 5">
    <path d="M60 90 L360 240"/>
    <path d="M60 240 L360 90"/>
  </g>
  <g fill="#222222" font-family="Georgia, serif" font-size="18" font-style="italic">
    <text x="366" y="246">a<tspan dy="5" font-size="13">1</tspan></text>
    <text x="366" y="96">a<tspan dy="5" font-size="13">2</tspan></text>
  </g>

  <path d="M60 90 L210 165 L360 90" fill="none" stroke="#375a9e" stroke-width="4"/>

  <g fill="#222222" font-family="Georgia, serif" font-size="18" font-style="italic" text-anchor="middle">
    <text x="210" y="66">y ≥ a<tspan dy="5" font-size="13">1</tspan><tspan dy="-5">,  y ≥ a</tspan><tspan dy="5" font-size="13">2</tspan></text>
  </g>
  <g fill="#375a9e" font-family="Georgia, serif" font-size="18" font-style="italic">
    <text x="248" y="172">y = max(a<tspan dy="5" font-size="13">1</tspan><tspan dy="-5">, a</tspan><tspan dy="5" font-size="13">2</tspan><tspan dy="-5">)</tspan></text>
  </g>
  <g fill="none" stroke="#222222" stroke-width="1.5">
    <path d="M45 270 H375"/>
    <path d="M60 285 V15"/>
  </g>

  <g fill="#222222" font-size="14" text-anchor="middle">
    <text x="60" y="292">0</text>
    <text x="120" y="292">1</text>
    <text x="180" y="292">2</text>
    <text x="240" y="292">3</text>
    <text x="300" y="292">4</text>
    <text x="360" y="292">5</text>
  </g>
  <g fill="#222222" font-size="14" text-anchor="end">
    <text x="53" y="215">1</text>
    <text x="53" y="155">2</text>
    <text x="53" y="95">3</text>
    <text x="53" y="35">4</text>
  </g>
  <g fill="#222222" font-family="Georgia, serif" font-size="20" font-style="italic">
    <text x="375" y="307">x</text>
    <text x="20" y="27">y</text>
  </g>
</svg>
