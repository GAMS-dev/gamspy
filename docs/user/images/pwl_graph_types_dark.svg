<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="Helvetica, Arial, sans-serif">
  <title>Piecewise linear graph types supported by GAMSPy</title>
  <desc>Six rounded panels show a connected graph, left and right rays, an excluded range, a discontinuity, and overlapping chains.</desc>
  <defs>
    <marker id="left-ray-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#5bc49e"/>
    </marker>
    <marker id="right-ray-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#5bc3cf"/>
    </marker>
  </defs>

  <rect x="15" y="15" width="290" height="280" rx="28" fill="#17283a" stroke="#6eb4ef" stroke-opacity="0.25"/>
  <rect x="335" y="15" width="290" height="280" rx="28" fill="#173129" stroke="#5bc49e" stroke-opacity="0.25"/>
  <rect x="655" y="15" width="290" height="280" rx="28" fill="#163136" stroke="#5bc3cf" stroke-opacity="0.25"/>
  <rect x="15" y="315" width="290" height="280" rx="28" fill="#38271e" stroke="#f3a15f" stroke-opacity="0.25"/>
  <rect x="335" y="315" width="290" height="280" rx="28" fill="#2a2138" stroke="#ae8ee8" stroke-opacity="0.25"/>
  <rect x="655" y="315" width="290" height="280" rx="28" fill="#3a2023" stroke="#f0706c" stroke-opacity="0.25"/>

  <g fill="#e4edf7" font-size="17" font-weight="bold">
    <text x="35" y="55">Connected graph</text>
    <text x="355" y="55">Left ray</text>
    <text x="675" y="55">Right ray</text>
    <text x="35" y="355">Excluded range</text>
    <text x="355" y="355">Discontinuity</text>
    <text x="675" y="355">Overlapping chains</text>
  </g>

  <g fill="#0d141d" fill-opacity="0.42">
    <rect x="45" y="70" width="250" height="185" rx="10"/>
    <rect x="365" y="70" width="250" height="185" rx="10"/>
    <rect x="685" y="70" width="250" height="185" rx="10"/>
    <rect x="45" y="370" width="250" height="185" rx="10"/>
    <rect x="365" y="370" width="250" height="185" rx="10"/>
    <rect x="685" y="370" width="250" height="185" rx="10"/>
  </g>

  <g fill="none" stroke="#c3ced8" stroke-opacity="0.16" stroke-width="1">
    <path d="M110 85 V245 M165 85 V245 M220 85 V245 M55 125 H285 M55 165 H285 M55 205 H285"/>
    <path d="M430 85 V245 M485 85 V245 M540 85 V245 M375 125 H605 M375 165 H605 M375 205 H605"/>
    <path d="M750 85 V245 M805 85 V245 M860 85 V245 M695 125 H925 M695 165 H925 M695 205 H925"/>
    <path d="M110 385 V545 M165 385 V545 M220 385 V545 M55 425 H285 M55 465 H285 M55 505 H285"/>
    <path d="M430 385 V545 M485 385 V545 M540 385 V545 M375 425 H605 M375 465 H605 M375 505 H605"/>
    <path d="M750 385 V545 M805 385 V545 M860 385 V545 M695 425 H925 M695 465 H925 M695 505 H925"/>
  </g>

  <g fill="none" stroke="#d2dae3" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M55 245 H285 M55 245 V85"/>
    <path d="M375 245 H605 M375 245 V85"/>
    <path d="M695 245 H925 M695 245 V85"/>
    <path d="M55 545 H285 M55 545 V385"/>
    <path d="M375 545 H605 M375 545 V385"/>
    <path d="M695 545 H925 M695 545 V385"/>
  </g>

  <path d="M75 215 L160 155 L265 95" fill="none" stroke="#6eb4ef" stroke-width="4"/>
  <g fill="#6eb4ef" stroke="#6eb4ef" stroke-width="3">
    <circle cx="75" cy="215" r="6"/>
    <circle cx="160" cy="155" r="6"/>
    <circle cx="265" cy="95" r="6"/>
  </g>

  <path d="M475 155 L585 100" fill="none" stroke="#5bc49e" stroke-width="4"/>
  <path d="M475 155 L390 185" fill="none" stroke="#5bc49e" stroke-width="4" marker-end="url(#left-ray-arrow)"/>
  <g fill="#5bc49e" stroke="#5bc49e" stroke-width="3">
    <circle cx="475" cy="155" r="6"/>
    <circle cx="585" cy="100" r="6"/>
  </g>

  <path d="M715 200 L815 135" fill="none" stroke="#5bc3cf" stroke-width="4"/>
  <path d="M815 135 L920 200" fill="none" stroke="#5bc3cf" stroke-width="4" marker-end="url(#right-ray-arrow)"/>
  <g fill="#5bc3cf" stroke="#5bc3cf" stroke-width="3">
    <circle cx="715" cy="200" r="6"/>
    <circle cx="815" cy="135" r="6"/>
  </g>

  <path d="M75 515 L150 460 M205 445 L280 390" fill="none" stroke="#f3a15f" stroke-width="4"/>
  <line x1="165" y1="505" x2="190" y2="505" stroke="#f3a15f" stroke-width="2" stroke-dasharray="8 6"/>
  <g fill="#f3a15f" stroke="#f3a15f" stroke-width="3">
    <circle cx="75" cy="515" r="6"/>
    <circle cx="150" cy="460" r="6"/>
    <circle cx="205" cy="445" r="6"/>
    <circle cx="280" cy="390" r="6"/>
  </g>

  <path d="M395 515 L475 465 M475 420 L595 385" fill="none" stroke="#ae8ee8" stroke-width="4"/>
  <line x1="475" y1="420" x2="475" y2="465" stroke="#ae8ee8" stroke-width="2" stroke-dasharray="7 6"/>
  <g fill="#ae8ee8" stroke="#ae8ee8" stroke-width="3">
    <circle cx="395" cy="515" r="6"/>
    <circle cx="475" cy="465" r="6"/>
    <circle cx="475" cy="420" r="6"/>
    <circle cx="595" cy="385" r="6"/>
  </g>

  <path d="M740 425 L915 385" fill="none" stroke="#f0706c" stroke-width="4"/>
  <path d="M715 510 L810 470" fill="none" stroke="#ae8ee8" stroke-width="4"/>
  <g stroke-width="3">
    <circle cx="740" cy="425" r="6" fill="#f0706c" stroke="#f0706c"/>
    <circle cx="915" cy="385" r="6" fill="#f0706c" stroke="#f0706c"/>
    <circle cx="715" cy="510" r="6" fill="#ae8ee8" stroke="#ae8ee8"/>
    <circle cx="810" cy="470" r="6" fill="#ae8ee8" stroke="#ae8ee8"/>
  </g>
</svg>
