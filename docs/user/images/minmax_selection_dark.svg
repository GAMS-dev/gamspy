<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" font-family="Helvetica, Arial, sans-serif">
  <title>Selection of a maximum</title>
  <desc>Selecting the first operand restricts y to the part of the maximum where the first operand is the largest, and selecting the second operand restricts it to the rest. Both can be selected where the operands are equal.</desc>
  <rect width="420" height="330" fill="#171c22"/>

  <g fill="none" stroke="#aab4c0" stroke-opacity="0.25" stroke-width="1">
    <path d="M120 30 V270 M180 30 V270 M240 30 V270 M300 30 V270 M360 30 V270"/>
    <path d="M60 210 H360 M60 150 H360 M60 90 H360 M60 30 H360"/>
  </g>

  <g fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="7 5">
    <path d="M60 90 L360 240"/>
    <path d="M60 240 L360 90"/>
  </g>
  <g fill="#dbe3ec" font-family="Georgia, serif" font-size="18" font-style="italic">
    <text x="366" y="246">a<tspan dy="5" font-size="13">1</tspan></text>
    <text x="366" y="96">a<tspan dy="5" font-size="13">2</tspan></text>
  </g>

  <path d="M60 90 L210 165" fill="none" stroke="#6eb4ef" stroke-width="4"/>
  <path d="M210 165 L360 90" fill="none" stroke="#f3a15f" stroke-width="4"/>
  <circle cx="210" cy="165" r="6" fill="#dbe3ec"/>

  <g font-family="Georgia, serif" font-size="18" font-style="italic" text-anchor="middle">
    <text x="118" y="162" fill="#6eb4ef">b<tspan dy="5" font-size="13">1</tspan><tspan dy="-5"> = 1</tspan></text>
    <text x="302" y="162" fill="#f3a15f">b<tspan dy="5" font-size="13">2</tspan><tspan dy="-5"> = 1</tspan></text>
  </g>
  <g fill="none" stroke="#dbe3ec" stroke-width="1.5">
    <path d="M45 270 H375"/>
    <path d="M60 285 V15"/>
  </g>

  <g fill="#dbe3ec" font-size="14" text-anchor="middle">
    <text x="60" y="292">0</text>
    <text x="120" y="292">1</text>
    <text x="180" y="292">2</text>
    <text x="240" y="292">3</text>
    <text x="300" y="292">4</text>
    <text x="360" y="292">5</text>
  </g>
  <g fill="#dbe3ec" font-size="14" text-anchor="end">
    <text x="53" y="215">1</text>
    <text x="53" y="155">2</text>
    <text x="53" y="95">3</text>
    <text x="53" y="35">4</text>
  </g>
  <g fill="#dbe3ec" font-family="Georgia, serif" font-size="20" font-style="italic">
    <text x="375" y="307">x</text>
    <text x="20" y="27">y</text>
  </g>
</svg>
