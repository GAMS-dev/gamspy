#### TESTS #####
.lag_template:
  extends: .uv_package_cache
  stage: test
  needs: [lag-cli-3.10, setup-lag-toolchain]
  tags: [linux-arm64]
  image: ghcr.io/astral-sh/uv:$UV_VERSION-trixie
  before_script:
    - uv venv .venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --group test
    - uv pip install gamspy-arm-perf
    - gamspy install license $LOCAL_LICENSE
    - UV_NO_CONFIG=1 gamspy install solver -a --use-uv
    - gamspy uninstall solver miles --use-uv
  script:
    - python -m pytest -n $NUM_PROCESS -x -ra -m 'unit or integration or model_library or requires_license' tests

lag-test-3.14:
  extends: [.lag_template, .pytest_with_coverage]
  variables:
    PYTHON_VERSION: "3.14"

lag-test-3.13:
  extends: [.lag_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.13"

lag-test-3.12:
  extends: [.lag_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.12"

lag-test-3.11:
  extends: [.lag_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.11"

lag-test-3.10:
  extends: .lag_template
  variables:
    PYTHON_VERSION: "3.10"

#### ENGINE #####
.lag_engine_template:
  extends: .uv_package_cache
  stage: engine
  when: manual
  needs: [setup-lag-toolchain]
  allow_failure: true
  tags: [linux-arm64]
  image: ghcr.io/astral-sh/uv:$UV_VERSION-trixie
  script:
    - uv venv .venv --python $PYTHON_VERSION && source .venv/bin/activate
    - uv sync --locked --group test
    - uv pip install gamspy-arm-perf
    - python -m pytest -x -ra -m 'engine' tests

lag-engine-3.14:
  extends: .lag_engine_template
  variables:
    PYTHON_VERSION: "3.14"

lag-engine-3.10:
  extends: .lag_engine_template
  variables:
    PYTHON_VERSION: "3.10"

