#### TESTS #####
.leg_template:
  extends: .uv_package_cache
  stage: test
  needs: [leg-cli-3.10, setup-leg-toolchain]
  tags: [linux]
  image: ghcr.io/astral-sh/uv:$UV_VERSION-trixie
  variables:
    UV_SYNC_EXTRA_ARGS: ""
  before_script:
    - uv venv .venv --python $PYTHON_VERSION && source .venv/bin/activate
    - uv sync --locked --group test $UV_SYNC_EXTRA_ARGS
    - gamspy install license $LOCAL_LICENSE
    - UV_NO_CONFIG=1 gamspy install solver -a --use-uv
    - gamspy uninstall solver miles --use-uv
  script:
    - python -m pytest -n $NUM_PROCESS -x -ra -m 'unit or integration or model_library or requires_license' tests

leg-test-3.14:
  extends: [.leg_template, .pytest_with_coverage]
  variables:
    PYTHON_VERSION: "3.14"
    UV_SYNC_EXTRA_ARGS: "--all-extras"
  script:
    - |
      if [ "$RUN_MIRO" == "1" ]; then
        git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@git.gams.com/miro/miro.git --branch gamspy --single-branch miro
        cd miro && ./scripts/test_gamspy_models.sh && cd .. && rm -rf miro
      fi
    - !reference [.pytest_with_coverage, script]
  coverage: '/TOTAL.*\s+(\d+\%)/'

leg-test-3.13:
  extends: [.leg_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.13"

leg-test-3.12:
  extends: [.leg_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.12"

leg-test-3.11:
  extends: [.leg_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.11"

leg-test-3.10:
  extends: .leg_template
  variables:
    PYTHON_VERSION: "3.10"

#### ENGINE #####
.leg_engine_template:
  extends: .uv_package_cache
  stage: engine
  when: manual
  needs: [setup-leg-toolchain]
  allow_failure: true
  tags: [linux]
  image: ghcr.io/astral-sh/uv:$UV_VERSION-trixie
  script:
    - uv venv .venv --python $PYTHON_VERSION && source .venv/bin/activate
    - uv sync --locked --group test
    - python -m pytest -x -ra -m 'engine' tests

leg-engine-3.14:
  extends: .leg_engine_template
  variables:
    PYTHON_VERSION: "3.14"

leg-engine-3.10:
  extends: .leg_engine_template
  variables:
    PYTHON_VERSION: "3.10"

