#### TESTS #####
.deg_template:
  extends: [.uv_package_cache, .develop_and_master_only]
  stage: test
  needs: [deg-cli-3.11, setup-deg-toolchain]
  tags: [macos]
  before_script:
    - export PATH="$CI_PROJECT_DIR/.uv_bin:$PATH"
    - uv venv .venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --group test
    - $(gamspy show base)/gamsgetkey $LOCAL_LICENSE > "$CI_PROJECT_DIR/ci_license.txt"
    - export GAMSPY_LICENSE_PATH="$CI_PROJECT_DIR/ci_license.txt"
    - UV_NO_CONFIG=1 gamspy install solver -a --use-uv
    - gamspy uninstall solver miles --use-uv
  script:
    - python -B -m pytest -n $NUM_PROCESS -x -ra -m 'unit or integration or model_library or requires_license' tests

deg-test-3.15:
  extends: [.deg_template, .pytest_with_coverage]
  variables:
    PYTHON_VERSION: "3.15"

deg-test-3.14:
  extends: .deg_template
  variables:
    PYTHON_VERSION: "3.14"

deg-test-3.13:
  extends: .deg_template
  variables:
    PYTHON_VERSION: "3.13"

deg-test-3.12:
  extends: .deg_template
  variables:
    PYTHON_VERSION: "3.12"

deg-test-3.11:
  extends: .deg_template
  variables:
    PYTHON_VERSION: "3.11"

#### ENGINE ####
.deg_engine_template:
  extends: .uv_package_cache
  stage: engine
  when: manual
  needs: [setup-deg-toolchain]
  allow_failure: true
  tags: [macos]
  script:
    - export PATH="$CI_PROJECT_DIR/.uv_bin:$PATH"
    - uv venv .venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --group test
    - python -B -m pytest -x -ra -m 'engine' tests

deg-engine-3.15:
  extends: .deg_engine_template
  variables:
    PYTHON_VERSION: "3.15"

deg-engine-3.11:
  extends: .deg_engine_template
  variables:
    PYTHON_VERSION: "3.11"

#### NEOS ####
.deg_neos_template:
  extends: .uv_package_cache
  stage: neos
  when: manual
  needs: [setup-deg-toolchain]
  allow_failure: true
  tags: [macos]
  script:
    - export PATH="$CI_PROJECT_DIR/.uv_bin:$PATH"
    - uv venv .venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --group test
    - gamspy install solver -a --use-uv
    - python -B -m pytest -x -ra -m 'neos' tests

deg-neos-3.15:
  extends: .deg_neos_template
