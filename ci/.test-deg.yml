#### TESTS #####
.deg_template:
  extends: [.uv_package_cache, .develop_and_master_only]
  stage: test
  needs: [setup-deg-toolchain]
  tags: [macos]
  before_script:
    - export PATH="$CI_PROJECT_DIR/.uv_bin:$PATH"
    - uv venv .venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --group test
    - $(gamspy show base)/gamsgetkey $LOCAL_LICENSE -o "$CI_PROJECT_DIR/ci_license.txt" $EXTRA_ARG
    - export GAMSPY_LICENSE_PATH="$CI_PROJECT_DIR/ci_license.txt"
    - UV_NO_CONFIG=1 gamspy install solver -a --use-uv
    - gamspy uninstall solver miles --use-uv
  script:
    - python -B -m pytest -n $NUM_PROCESS -x -ra -m 'unit or integration or model_library or requires_license' tests

deg-test-3.15:
  extends: [.deg_template, .pytest_with_coverage]
  variables:
    PYTHON_VERSION: "3.15"
