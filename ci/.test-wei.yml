#### TESTS #####
.wei_template:
  extends: .uv_package_cache
  stage: test
  needs: [setup-wei-toolchain]
  tags: [windows]
  before_script:
    - !reference [.wei_unpack_toolchain, script]
    - uv venv .venv --python $env:PYTHON_VERSION
    - .venv\Scripts\Activate.ps1
    - uv sync --locked --group test
    - gamspy install license $env:LOCAL_LICENSE
    - $env:UV_NO_CONFIG="1"; gamspy install solver -a --use-uv
    - gamspy uninstall solver miles --use-uv
  script:
    - python -m pytest -x -ra -m 'unit or integration or model_library or requires_license' tests

wei-test-3.15:
  extends: [.wei_template, .wei_pytest_with_coverage]
  variables:
    PYTHON_VERSION: "3.15"

wei-test-3.14:
  extends: [.wei_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.14"

wei-test-3.13:
  extends: [.wei_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.13"

wei-test-3.12:
  extends: [.wei_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.12"

wei-test-3.11:
  extends: [.wei_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.11"

#### ENGINE #####
.wei_engine_template:
  extends: .uv_package_cache
  stage: engine
  when: manual
  needs: [setup-wei-toolchain]
  allow_failure: true
  tags: [windows]
  script:
    - !reference [.wei_unpack_toolchain, script]
    - uv venv .venv --python $env:PYTHON_VERSION
    - .venv\Scripts\Activate.ps1
    - uv sync --locked --group test
    - python -m pytest -x -ra -m 'engine' tests

wei-engine-3.15:
  extends: .wei_engine_template
  variables:
    PYTHON_VERSION: "3.15"

wei-engine-3.11:
  extends: .wei_engine_template
  variables:
    PYTHON_VERSION: "3.11"

