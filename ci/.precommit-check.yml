leg-precommit:
  stage: precommit
  when: on_success
  tags: [linux]
  image: astral/uv:python3.13-trixie
  variables:
    PREK_HOME: "$CI_PROJECT_DIR/.prek_cache"
  cache:
    key: "prek-$CI_JOB_NAME"
    paths:
      - .prek_cache/
  script:
    - uv audit --ignore-until-fixed GHSA-rrmf-rvhw-rf47 --frozen
    - uv pip install --system prek ty
    - prek run --all-files
    # Removes the repositories and environments of hook versions that are no longer configured
    - prek cache gc
