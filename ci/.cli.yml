dac-cli-3.15:
  extends: .uv_package_cache
  stage: cli
  when: on_success
  needs: [setup-dac-toolchain]
  tags: [macos-arm64]
  script:
    - export PATH="$CI_PROJECT_DIR/.uv_bin:$PATH"
    - uv venv .venv --python 3.15
    - source .venv/bin/activate
    - uv build
    - uv sync --locked --group test
    - UV_NO_CONFIG=1 python -m pytest -x -ra -m 'cli' tests

