leg-cli-3.15:
  extends: .uv_package_cache
  stage: cli
  needs: [setup-leg-toolchain]
  tags: [linux]
  image: ghcr.io/astral-sh/uv:$UV_VERSION-trixie
  script:
    - uv venv .venv --python 3.15
    - source .venv/bin/activate
    - uv build
    - uv sync --locked --group test
    - UV_NO_CONFIG=1 python -m pytest -x -ra -m 'cli' tests

