wei-cli-3.15:
  extends: .uv_package_cache
  stage: cli
  needs: [setup-wei-toolchain]
  tags: [windows]
  script:
    - !reference [.wei_unpack_toolchain, script]
    - uv venv .venv --python 3.15
    - .venv\Scripts\Activate.ps1
    - uv build
    - uv sync --locked --group test
    - $env:UV_NO_CONFIG="1"; python -m pytest -x -ra -m 'cli' tests

