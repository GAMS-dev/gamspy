.develop_and_master_only:
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"

# Runs the tests with coverage and reports the coverage to GitLab
.pytest_with_coverage:
  variables:
    COVERAGE_CORE: "sysmon"
  script:
    - coverage run --source=gamspy -m pytest -n $NUM_PROCESS -x -ra -m 'unit or integration or model_library or requires_license or doc' tests
    - coverage report -m --data-file=".coverage"
    - coverage xml --data-file=".coverage"
  artifacts:
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Windows runs the tests without pytest-xdist and without the doc tests
.wei_pytest_with_coverage:
  extends: .pytest_with_coverage
  script:
    - coverage run --source=gamspy -m pytest -x -ra -m 'unit or integration or model_library or requires_license' tests
    - coverage report -m --data-file=".coverage"
    - coverage xml --data-file=".coverage"
