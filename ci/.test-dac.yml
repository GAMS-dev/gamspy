#### TESTS #####
.dac_template:
  extends: .uv_package_cache
  stage: test
  needs: [dac-cli-3.11, setup-dac-toolchain]
  tags: [macos-arm64]
  before_script:
    - export PATH="$CI_PROJECT_DIR/.uv_bin:$PATH"
    - uv venv .venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --group test
    - $(gamspy show base)/gamsgetkey $LOCAL_LICENSE > "$CI_PROJECT_DIR/ci_license.txt"
    - export GAMSPY_LICENSE_PATH="$CI_PROJECT_DIR/ci_license.txt"
    - UV_NO_CONFIG=1 gamspy install solver -a --use-uv
    - gamspy uninstall solver miles --use-uv
  script:
    - python -B -m pytest -n $NUM_PROCESS -x -ra -m 'unit or integration or model_library or requires_license' tests

dac-test-3.15:
  extends: [.dac_template, .pytest_with_coverage]
  variables:
    PYTHON_VERSION: "3.15"

dac-test-3.14:
  extends: [.dac_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.14"

dac-test-3.13:
  extends: [.dac_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.13"

dac-test-3.12:
  extends: [.dac_template, .develop_and_master_only]
  variables:
    PYTHON_VERSION: "3.12"

dac-test-3.11:
  extends: .dac_template
  variables:
    PYTHON_VERSION: "3.11"

#### ENGINE #####
.dac_engine_template:
  extends: .uv_package_cache
  stage: engine
  when: manual
  needs: [setup-dac-toolchain]
  allow_failure: true
  tags: [macos-arm64]
  script:
    - export PATH="$CI_PROJECT_DIR/.uv_bin:$PATH"
    - uv venv .venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --group test
    - python -B -m pytest -x -ra -m 'engine' tests

dac-engine-3.15:
  extends: .dac_engine_template
  variables:
    PYTHON_VERSION: "3.15"

dac-engine-3.11:
  extends: .dac_engine_template
  variables:
    PYTHON_VERSION: "3.11"

#### NEOS #####
.dac_neos_template:
  extends: .uv_package_cache
  stage: neos
  when: manual
  needs: [setup-dac-toolchain]
  allow_failure: true
