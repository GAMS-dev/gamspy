repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: end-of-file-fixer
        exclude: ^(tests\/integration\/miro_models|docs|tests\/integration\/tex_references)
    -   id: check-added-large-files
        args: ['--maxkb=50000']
    -   id: check-ast
    -   id: check-case-conflict
-   repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.99
    hooks:
    -   id: ty
        entry: uv run --active ty check src
        language: python
        pass_filenames: false
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
    # Run the linter.
    -   id: ruff-check
        args: [ --fix ]
    # Run the formatter.
    -   id: ruff-format
-   repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.0
    hooks:
    -   id: betterleaks
        entry: betterleaks dir --config .betterleaks.toml --no-banner --redact --verbose
        pass_filenames: true
-   repo: local
    hooks:
    -   id: scan-site-packages
        name: Scan site-packages for startup code
        entry: python -I -S scripts/scan_site_packages.py
        language: system
        pass_filenames: false
        always_run: true
